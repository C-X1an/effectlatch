[package]
name = "effectlatch-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
base64 = "=0.22.1"
subtle = "=2.6.1"
uuid = { version = "=1.26.0", features = ["v4"] }
thiserror = "=2.0.20"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
toml = { version = "=1.0.7", default-features = false, features = ["std", "serde", "parse"] }
effectlatch-store = { path = "../store" }
effectlatch-domain = { path = "../domain" }
effectlatch-runtime = { path = "../runtime" }
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }
[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
tower = { version = "=0.5.3", features = ["util"] }
